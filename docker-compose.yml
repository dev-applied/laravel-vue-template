networks:
    default:
        external: true
        name: nginx-proxy
    # Created per compose project (as <project>_app), so each project — and each
    # git worktree of it — gets its own DNS namespace for service-to-service
    # traffic. Not `internal:` — stripe-cli needs outbound access to the Stripe API.
    app:
        driver: bridge
