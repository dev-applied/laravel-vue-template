name: CI

on:
  workflow_dispatch:
  # No branch filter on pull_request, deliberately. The template's default
  # branch is `master` while projects bootstrapped from it use `main` / `dev` /
  # `staging` — a filter naming specific branches means CI silently never runs
  # in whichever repo picked the other name. Every PR gets checked instead.
  pull_request:
  # Pushes to the long-lived branches are already covered by the PR that merged
  # into them, so only feature-branch pushes need a run here.
  push:
    branches-ignore:
      - main
      - master
      - staging
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    runs-on: ubuntu-latest
    environment: 'CI'
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_USER: laravel_user
          MYSQL_PASSWORD: laravel_pass
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: laravel_template_testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v4
      - name: Configure PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, ctype, fileinfo, openssl, PDO, bcmath, json, tokenizer, xml, intl, bz2, gd
      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Install Composer dependencies
        run: |
          ENV="
            ${{ vars.ENV }}
            APP_KEY=base64:UDBdQUUlqrSVXTfkh3d8kqUE9g+5CMIxHYc11cdZ+eQ=
            DB_CONNECTION=mysql
            DB_HOST=127.0.0.1
            DB_PORT=3306
            DB_DATABASE=laravel_template_testing
            DB_USERNAME=root
            DB_PASSWORD=root
          "
          printf "%s" "$ENV" > .env
          composer install --prefer-dist --optimize-autoloader
          cp .env .env.testing
      # Before the suite, because it explains a whole class of failure the
      # suite reports as something else. The template bundles every module, so
      # every run executes every bundled module's tests — and a module whose
      # composer dependency was installed locally by `module:add` but never
      # COMMITTED fails with "Class X not found" in a job that has nothing to
      # do with that module. Three legs went red exactly that way on
      # 2026-08-25 before this existed.
      - name: Check installed modules have their declared dependencies
        # --defaults is template-only. A real project picks variants on purpose,
        # so drift there is normal; here the bundle is meant to be whatever each
        # manifest calls default. Billing shipped its QA entitlement-switcher
        # variant this way once, left behind by a verification run and visible
        # only in a git diff. Announcements is a deliberate, committed exception.
        run: php artisan module:check --defaults --allow=Announcements:delivery=in-app+email

      - name: Run Pint + Pest (composer ci)
        run: composer ci

  frontend:
    name: Frontend (lint + type-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install npm dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      # Four conventions that are invisible to eslint and vue-tsc because the
      # code is valid and only the RENDER is wrong: a Material Icons ligature
      # name that does not exist draws the string instead of a glyph, a Vuetify
      # v3 typography class contributes nothing in v4, a hardcoded hex never
      # follows a brand theme, and an icon-only button announces nothing to a
      # screen reader. The modules repo's bin/lint has covered modules/ for a
      # while; it globs modules/*/resources/ts and has never been able to see
      # this repo's own pages, which is how three unlabelled buttons and a dead
      # 404 page shipped here.
      - name: Kernel conventions (icons, typography, theming, a11y)
        run: ./bin/lint-kernel
      - name: vue-tsc type check
        run: npm run type-check
      - name: Vitest
        run: npm run test:ci

  capacitor-build:
    name: Capacitor build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install npm dependencies
        run: npm ci
      - name: Build (capacitor mode)
        run: npm run build:capacitor
      - name: Verify dist output exists
        run: |
          test -d dist
          test -f dist/index.html
