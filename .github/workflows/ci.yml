name: CI

on:
  workflow_dispatch:
  # No branch filter on pull_request, deliberately. The template's default
  # branch is `master` while projects bootstrapped from it use `main` / `dev` /
  # `staging` — a filter naming specific branches means CI silently never runs
  # in whichever repo picked the other name. Every PR gets checked instead.
  pull_request:
  # Pushes to the long-lived branches are already covered by the PR that merged
  # into them, so only feature-branch pushes need a run here.
  push:
    branches-ignore:
      - main
      - master
      - staging
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    runs-on: ubuntu-latest
    environment: 'CI'
    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_USER: laravel_user
          MYSQL_PASSWORD: laravel_pass
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: laravel_db
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3
    steps:
      - uses: actions/checkout@v4
      - name: Configure PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, ctype, fileinfo, openssl, PDO, bcmath, json, tokenizer, xml, intl, bz2, gd
      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT
      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-
      - name: Install Composer dependencies
        run: |
          ENV="
            ${{ vars.ENV }}
            APP_KEY=base64:UDBdQUUlqrSVXTfkh3d8kqUE9g+5CMIxHYc11cdZ+eQ=
            DB_CONNECTION=mysql
            DB_HOST=127.0.0.1
            DB_PORT=3306
            DB_DATABASE=laravel_db
            DB_USERNAME=root
            DB_PASSWORD=root
          "
          printf "%s" "$ENV" > .env
          composer install --prefer-dist --optimize-autoloader
          cp .env .env.testing
      - name: Run Pint + Pest (composer ci)
        run: composer ci

  frontend:
    name: Frontend (lint + type-check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install npm dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint
      - name: vue-tsc type check
        run: npm run type-check
      - name: Vitest
        run: npm run test:ci

  capacitor-build:
    name: Capacitor build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node from .nvmrc
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install npm dependencies
        run: npm ci
      - name: Build (capacitor mode)
        run: npm run build:capacitor
      - name: Verify dist output exists
        run: |
          test -d dist
          test -f dist/index.html
