name: Deploy //environment//

on:
  workflow_dispatch:
#  push:
#    branches:
#      - //branch//

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy To Lambda
    environment: //github_environment//
    runs-on: ubuntu-latest

    # Prefer environment SECRETS, fall back to variables — same contract as
    # dev-applied/deploy-action. Variables are readable by any collaborator and
    # are not masked in logs, so every sensitive value below should live as a
    # secret; the `|| vars.X` fallback only exists so un-migrated projects keep
    # deploying. Resolved once here and consumed as $ENV / $DB_PASSWORD / … so
    # the values are never interpolated into a `run:` script (which would print
    # them into the log when they come from a variable).
    env:
      ENV: ${{ secrets.ENV || vars.ENV }}
      VPC_ID: ${{ secrets.VPC_ID || vars.VPC_ID }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD || vars.DB_PASSWORD }}
      SSL_ARN: ${{ secrets.SSL_ARN || vars.SSL_ARN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID || vars.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY || vars.AWS_SECRET_ACCESS_KEY }}

    steps:
      - name: Check for required configuration
        run: |
          # Reports every missing name at once instead of failing on the first.
          # Uses `if` rather than `[ … ] && missing=…`: GitHub runs `run:` under
          # `bash -e`, where an AND-list that short-circuits false as the LAST
          # line of the script fails the step. `if` has no such edge.
          missing=""
          for name in VPC_ID DB_PASSWORD SSL_ARN AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY ENV; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "Error: missing required configuration:$missing" >&2
            echo "Set each as an environment secret (preferred) or variable." >&2
            exit 1
          fi

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Compile CSS and Javascript
        run: |
          printf "%s" "$ENV" > ".env"
          npm install
          npm run build

      - name: Configure PHP 8.3
        uses: shivammathur/setup-php@master
        with:
          php-version: '8.3'
          extensions: mbstring, ctype, fileinfo, openssl, PDO, bcmath, json, tokenizer, xml

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer dependencies
        run: |
          printf "%s" "$ENV" > ".env"
          composer install --prefer-dist --optimize-autoloader --no-dev

      - name: Deploy to AWS Lambda
        run: |
          printf "%s" "$ENV" > ".env"
          npx serverless deploy --stage=\\stage\\ --param="VPC_ID=$VPC_ID" --param="DB_PASSWORD=$DB_PASSWORD" --param="SSL_ARN=$SSL_ARN"
          npx serverless bref:cli --stage=\\stage\\ --args="migrate --force" --function artisan --param="VPC_ID=$VPC_ID" --param="DB_PASSWORD=$DB_PASSWORD" --param="SSL_ARN=$SSL_ARN"
